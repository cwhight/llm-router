claude:
  api_key: "${ANTHROPIC_API_KEY}"
  default_model: claude-sonnet-4-6
  opus_model: claude-opus-4-7
  haiku_model: claude-haiku-4-5-20251001

ollama:
  host: "http://localhost:11434"
  # Ollama cloud API key — sign in at https://ollama.com to get yours
  api_key: "${OLLAMA_API_KEY}"
  models:
    small: "qwen3-coder-next:cloud"    # 80B, ~7s, code-optimised, 262k ctx (free tier)
    large: "devstral-2:123b-cloud"     # 123B, ~8s, Mistral coding specialist, 262k ctx (free tier)
    general: "gpt-oss:120b-cloud"      # 117B, thinking capability, general prose/reasoning (free tier)

routing:
  # Quality threshold (0-10) — if a model scores below this for a category,
  # the category gets bumped to the next tier
  quality_threshold: 7

  # Default routing rules (overridden by benchmark data)
  # All ollama tiers use Ollama cloud models — free, no local GPU needed
  defaults:
    summarise: ollama:general
    extract: ollama:general
    classify: ollama:general
    format: ollama:small
    rewrite: ollama:general
    simple-code: ollama:small
    explain: ollama:general
    complex-code: ollama:large
    wireframe-prose: ollama:general
    reason: claude:opus
    agent: claude:default

  # Categories that always use Claude — require tool use or multi-step reasoning
  claude_only:
    - agent
    - reason

benchmarks:
  # How many tasks to sample for quality scoring
  sample_rate: 0.1
  # Path to benchmark results
  results_file: "benchmarks/results.jsonl"
  # Re-evaluate routing after this many results per category
  reeval_threshold: 50

metrics:
  # Expose Prometheus metrics
  enabled: true
  addr: ":2113"
